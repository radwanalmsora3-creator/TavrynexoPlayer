name: Build Tavrynexo Player Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Single-EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.6.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: false

      - name: Download & Prepare libmpv SDK
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "C:\libmpv", "C:\libmpv-sdk\include", "C:\libmpv-sdk\lib", "C:\libmpv-sdk\bin" | Out-Null
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{ "User-Agent" = "TavrynexoCI" }
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find mpv-dev-x86_64 archive in latest release." }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "C:\libmpv\mpv-dev.7z" -UserAgent "TavrynexoCI"
          7z x "C:\libmpv\mpv-dev.7z" -o"C:\libmpv" -y | Out-Null
          $dll = Get-ChildItem -Path "C:\libmpv" -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          $clientH = Get-ChildItem -Path "C:\libmpv" -Recurse -Filter "client.h" | Where-Object { $_.Directory.Name -eq "mpv" } | Select-Object -First 1
          if (-not $dll -or -not $clientH) { throw "Invalid mpv-dev package structure." }
          Copy-Item -Recurse -Force "$($clientH.Directory.Parent.FullName)\*" "C:\libmpv-sdk\include\"
          Copy-Item -Force $dll.FullName "C:\libmpv-sdk\bin\libmpv-2.dll"
          $exports = & dumpbin /exports $dll.FullName
          $lines = @("LIBRARY libmpv-2.dll", "EXPORTS")
          $cap = $false
          foreach ($l in $exports) {
            if ($l -match "ordinal\s+hint\s+RVA\s+name") { $cap = $true; continue }
            if ($l -match "^\s*Summary") { break }
            if ($cap) {
              $p = $l.Trim() -split '\s+'
              if ($p.Count -ge 4 -and $p[3] -and $p[3] -ne "=") { $lines += $p[3] }
            }
          }
          Set-Content -Path "C:\libmpv-sdk\lib\mpv.def" -Value $lines -Encoding ASCII
          & lib.exe /def:"C:\libmpv-sdk\lib\mpv.def" /machine:x64 /out:"C:\libmpv-sdk\lib\libmpv-2.lib"
          if (-not (Test-Path "C:\libmpv-sdk\lib\libmpv-2.lib")) { throw "lib.exe failed to build libmpv-2.lib" }

      - name: Configure & Build Tavrynexo Player
        shell: powershell
        run: |
          cmake -S TavrynexoPlayer -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DMPV_ROOT="C:/libmpv-sdk"
          cmake --build build --parallel

      - name: Deploy & Pack Single EXE
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "dist", "stage", "out" | Out-Null
          Copy-Item "build\TavrynexoPlayer.exe" "dist\TavrynexoPlayer.exe"
          Copy-Item "C:\libmpv-sdk\bin\libmpv-2.dll" "dist\libmpv-2.dll"
          & "$env:Qt6_DIR\bin\windeployqt.exe" --release --no-translations --no-compiler-runtime "dist\TavrynexoPlayer.exe"
          $crtDir = Get-ChildItem -Path "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if ($crtDir) { Copy-Item "$($crtDir.FullName)\*.dll" "dist\" -Force }
          Move-Item "dist\TavrynexoPlayer.exe" "stage\TavrynexoPlayer.exe" -Force
          Invoke-WebRequest -Uri "https://www.enigmaprotector.com/assets/files/enigmavb.exe" -OutFile "enigmavb.exe" -UserAgent "TavrynexoCI"
          Start-Process -FilePath ".\enigmavb.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          npm install -g generate-evb
          node -e "const g=require('generate-evb'),p=require('path'); g(p.resolve('pack.evb'), p.resolve('stage/TavrynexoPlayer.exe'), p.resolve('out/TavrynexoPlayer.exe'), p.resolve('dist'));"
          $evbCli = "${env:ProgramFiles(x86)}\Enigma Virtual Box\enigmavbconsole.exe"
          if (-not (Test-Path $evbCli)) { $evbCli = "${env:ProgramFiles}\Enigma Virtual Box\enigmavbconsole.exe" }
          if (-not (Test-Path $evbCli)) { throw "enigmavbconsole.exe not found" }
          & $evbCli (Resolve-Path "pack.evb").Path
          if (-not (Test-Path "out\TavrynexoPlayer.exe")) { throw "Single-EXE build failed." }
          Get-Item "out\TavrynexoPlayer.exe" | Select-Object Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-Windows-x64
          path: out/TavrynexoPlayer.exe
