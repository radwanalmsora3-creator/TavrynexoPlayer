name: Build Tavrynexo Player Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.6.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: false

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $vulkanVer = "1.3.296.0"
          $installer = "VulkanSDK-${vulkanVer}-Installer.exe"
          $downloadUrl = "https://sdk.lunarg.com/sdk/download/${vulkanVer}/windows/${installer}"

          try {
            Invoke-WebRequest -Uri $downloadUrl -OutFile $installer -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -UseBasicParsing
          } catch {
            $vulkanVer = "1.4.304.0"
            $installer = "VulkanSDK-${vulkanVer}-Installer.exe"
            $downloadUrl = "https://sdk.lunarg.com/sdk/download/${vulkanVer}/windows/${installer}"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $installer -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -UseBasicParsing
          }

          Start-Process -FilePath ".\$installer" -ArgumentList "install", "--accept-licenses", "--default-answer", "--confirm-command" -Wait
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          $sdkPath = "C:\VulkanSDK\$vulkanVer"
          if (Test-Path $sdkPath) {
            "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "$sdkPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            $found = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              "VULKAN_SDK=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
              "$($found.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            }
          }

      - name: Download & Extract FFmpeg Shared
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -UseBasicParsing
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg_temp" -Force
          $extracted = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg_temp" -Directory | Select-Object -First 1
          Move-Item -Path $extracted.FullName -Destination "C:\ffmpeg"
          "FFMPEG_DIR=C:\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Remove-Item "ffmpeg.zip" -Force -ErrorAction SilentlyContinue

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path "TavrynexoPlayer\CMakeLists.txt") {
            $srcDir = "TavrynexoPlayer"
          } elseif (Test-Path "CMakeLists.txt") {
            $srcDir = "."
          } else {
            Write-Error "CMakeLists.txt not found!"
            exit 1
          }
          Write-Host "Using source directory: $srcDir"
          "SRC_DIR=$srcDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          cmake -B build -S $srcDir -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;C:\ffmpeg;$env:VULKAN_SDK" `
            -DFFMPEG_ROOT="C:\ffmpeg" `
            -DVulkan_ROOT="$env:VULKAN_SDK"

      - name: Build Tavrynexo Player
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package with windeployqt & FFmpeg DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/TavrynexoPlayer"
          $exeItem = Get-ChildItem -Path "build" -Filter "TavrynexoPlayer.exe" -Recurse | Select-Object -First 1
          if (-not $exeItem) {
            Write-Error "TavrynexoPlayer.exe was not found in build directory!"
            exit 1
          }
          Copy-Item $exeItem.FullName "package\TavrynexoPlayer\"

          $qmlDir = Join-Path $env:SRC_DIR "qml"
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          & $windeployqt --release --qmldir $qmlDir --compiler-runtime package\TavrynexoPlayer\TavrynexoPlayer.exe

          Copy-Item "C:\ffmpeg\bin\*.dll" "package\TavrynexoPlayer\" -Force
          Compress-Archive -Path "package\TavrynexoPlayer\*" -DestinationPath "TavrynexoPlayer-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-Windows-x64
          path: TavrynexoPlayer-Windows-x64.zip
          retention-days: 14
